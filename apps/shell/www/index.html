<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Sen</title>
    <link rel="stylesheet" href="offline.css" />
  </head>
  <body>
    <!-- The shell's own page, from the APK. It shows only when the site can't load and the service
         worker hasn't cached it yet: a first launch offline, or a cache Android cleared. The shell
         passes the address it loads as ?app=, so Try again goes back to exactly that site. -->
    <main>
      <h1 id="title">Sen can't reach its site</h1>
      <p id="body">Connect to the internet once to finish setting up Sen. After that it opens offline too.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
