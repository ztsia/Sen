          - text: What the bank app shows
          - textbox "What the bank app shows":
            - /placeholder: "0.00"
        - button "TNG eWallet matches"
    - listitem:
      - group "GO+":
        - paragraph: /GO\+ Sen has RM \d+,\d+\.\d+/
        - group:
          - text: What the bank app shows
          - textbox "What the bank app shows":
            - /placeholder: "0.00"
        - button "GO+ matches"
    - listitem:
      - group "GrabPay Wallet":
        - paragraph: /GrabPay Wallet Sen has RM \d+\.\d+/
