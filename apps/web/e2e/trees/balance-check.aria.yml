- banner:
  - button "Back"
  - heading "Balance check" [level=1]
- main:
  - paragraph: Type each bank app's balance, or tap Matches. A difference is booked as Unaccounted.
  - list:
    - listitem:
      - group "Ryt Bank":
        - paragraph: /Ryt Bank Sen has RM \d+,\d+\.\d+/
        - group:
          - text: What the bank app shows
          - textbox "What the bank app shows":
            - /placeholder: "0.00"
        - button "Ryt Bank matches"
    - listitem:
      - group "Public Bank":
        - paragraph: /Public Bank Sen has RM \d+,\d+\.\d+/
