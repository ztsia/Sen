<style>
/* Layout: a dark control strip on top; below it the phone, full screen on a phone, framed on a desktop. Greyscale on purpose: this is structure, not the look */
:root {

}
* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--note); outline-offset: 2px; }
#root { height: 100%; display: flex; flex-direction: column; }
#strip { flex: none; background: var(--strip); color: var(--stripink); padding: 8px 10px; }
#stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
#phone { position: relative; width: 100%; height: 100%; background: var(--paper); overflow: hidden; }
@media (min-width: 600px) {
  #stage { padding: 16px; }
  #phone { width: 390px; height: min(820px, 100%); border-radius: 34px; border: 10px solid #111; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
}

/* control strip */
.tools { display: flex; gap: 6px; align-items: center; overflow-x: auto; }
.brand { font-weight: 700; margin-right: auto; white-space: nowrap; font-size: 13px; opacity: .85; padding-right: 4px; }
.tools button { flex: none; border: 1px solid #4a4a4a; border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; }

/* app frame */

.tag.ns { border-style: dashed; border-color: var(--ink); color: var(--ink); }

.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }

// ---------- Splits (D64, D65, D71) ----------
function spDone(sp) { return sp.members.filter((m) => m !== sp.payer && sp.paid[m]).length; }
function nm(m) { return m === 'You' ? 'Wei Ming' : m; }
function claimers(sp, k, me) { // "Ali", or "Shared ÷3: Wei Ming, Ali, you · your part RM6.99"
  const o = sp.owners[k]; if (!o.length) return '';
  const names = o.map((i) => (i === me ? 'you' : (me == null ? sp.members[i] : nm(sp.members[i]))));
  if (o.length === 1) return names[0];
  const parts = apportion(prices(sp.rid)[k], o.map(() => 1)); const mine = me == null ? o.indexOf(sp.members.indexOf('You')) : o.indexOf(me);
  return `Shared ÷${o.length}: ${names.join(', ')}${mine >= 0 ? ` · your part ${rm(parts[mine])}` : ''}`;
}
function roster(sp, me) { return sp.members.map((m) => `<span class="${sp.done[m] ? 'done' : 'notdone'}">${sp.done[m] ? '✓' : '…'} ${esc(me === 'pub' ? nm(m) : m)}</span>`).join(''); }
function statusCard(sp, id, who) {
  const rc = R[sp.rid]; const un = spUnclaimed(sp); const wait = spWaiting(sp);
  if (sp.locked) return `<div class="card strong" id="${id}"><b>Final</b><span class="sub">Everyone is done and every item is claimed, so the shares are locked.${who === 'payer' ? ' You can still change a tick.' : ` To change a tick, ask ${esc(nm(sp.payer))}.`}</span></div>`;
  const left = [];
  if (wait.length) left.push(`not done yet: ${wait.map((m) => (who === 'pub' ? nm(m) : m)).join(', ')}`);
  if (un.length) left.push(`nobody has ticked ${un.map((k) => rc.items[k][0]).join(', ')}`);
  return `<div class="card strong" id="${id}"><b>Still changing</b><span class="sub">Everyone ticks what they had, in any order, then taps Done. It locks when everyone is done and every item is claimed.</span><div class="roster">${roster(sp, who)}</div>${left.length ? `<span class="sub">Waiting: ${esc(left.join('; '))}</span>` : ''}</div>`;
}
SCR.split = (r) => {
  const sp = S.splits[r.id] || S.splits.s1; const rc = R[sp.rid]; const p = prices(sp.rid); const sh = spShares(sp); const iPaid = sp.payer === 'You'; const you = sp.members.indexOf('You');
  let h = `<div class="cardrow"><div class="stack" style="gap:0"><b style="font-size:18px">${esc(rc.m)}</b><span class="sub">${esc(rc.when)} · ${rm(rc.total)}</span></div><span class="chip on">Paid by ${esc(sp.payer)}</span></div>`;
  h += statusCard(sp, 'sp-status', iPaid ? 'payer' : 'member');
  if (iPaid && sp.open && !sp.locked) h += `<div class="card center" id="sp-qr">${qrSvg(11)}<span class="sub">Friends scan this at the table. No app, no login.</span>${B('Share the link', 'noop', { x: 'Opens Android’s share sheet with the link' }, 'ghost sm')}</div>`;
  h += `<div class="sec"><span>Tick what you had</span><span>shared items split evenly</span></div><div class="list">${rc.items.map((it, k) => { const mine = sp.owners[k].includes(you); const who = claimers(sp, k, null);
    return `<div class="check${sp.owners[k].length ? '' : ' unclaimed'}" id="sp-item${k}"><button class="box${mine ? ' on' : ''}" data-a="spMine" data-x="${sp.id}" data-y="${k}" id="sp-mine${k}" aria-label="I had ${esc(it[0])}">${mine ? '✓' : ''}</button><span>${esc(it[0])}<span class="sub" style="display:block">${who || 'Nobody yet'}</span>${!sp.owners[k].length && iPaid ? `<span class="row2" style="margin-top:4px">${B('Everyone', 'spAssign', { x: sp.id, y: k, z: 'all' }, 'sm ghost')}${B('Someone else…', 'sheet', { x: 'owners', id: sp.id, y: k }, 'sm ghost')}</span>` : ''}</span><span class="amt">${rm(p[k])}</span></div>`; }).join('')}</div>`;
  if (!sp.locked) {
    h += sp.done.You ? `<div class="card cardrow" id="sp-done-state"><span>You’re done ✓</span>${B('Still ticking', 'spDone', { x: sp.id, y: 'You' }, 'ghost sm')}</div>` : B('I’ve ticked everything I had', 'spDone', { x: sp.id, y: 'You', id: 'sp-done' }, 'pri full');
    if (iPaid && !spUnclaimed(sp).length && spWaiting(sp).some((m) => m !== 'You')) h += `<button class="link" data-a="spLockNow" data-x="${sp.id}" id="sp-locknow">Lock without waiting for ${esc(spWaiting(sp).filter((m) => m !== 'You').join(', '))}</button>`;
  }
  if (iPaid && sp.locked) {
    h += `<div class="sec"><span>Who has paid you back</span><span>${spDone(sp)} of ${sp.members.length - 1}</span></div><div class="list" id="sp-ticks">${sp.members.filter((m) => m !== 'You').map((m) => `<div class="check" id="sp-${m}"><button class="box${sp.paid[m] ? ' on' : ''}" data-a="spPaid" data-x="${sp.id}" data-y="${m}" aria-label="Mark ${m} paid" id="sp-tick-${m}">${sp.paid[m] ? '✓' : ''}</button><span>${esc(m)}<span class="sub" style="display:block">${sp.paid[m] ? esc(sp.how[m] || 'ticked by you') : 'Not yet. Their payment ticks this by itself; tick cash by hand'}</span></span><span class="amt">${rm(sh[m])}</span></div>`).join('')}</div>`;
  } else if (iPaid) {
    h += `<div class="sec"><span>Shares so far</span><span>still changing</span></div><div class="list" id="sp-ticks">${sp.members.map((m) => `<div class="lrow"><span>${esc(m)}</span><span class="v">${rm(sh[m])}</span></div>`).join('')}</div>`;
  } else {
    h += `<div class="card strong" id="sp-owe"><span class="cardrow"><b>You owe ${esc(sp.payer)}</b><b>${rm(sh.You)}</b></span><span class="sub">${!sp.locked ? 'Still changing until everyone is done.' : sp.paid.You ? 'Paid ✓ ' + esc(sp.how.You || '') : 'Not paid yet. Your payment to ' + esc(sp.payer) + ' ticks this by itself. Sen reminds you an hour after the split.'}</span>${sp.locked && !sp.paid.You ? B('I’ve paid', 'spPaid', { x: sp.id, y: 'You', id: 'sp-ive-paid' }, 'sm') : ''}</div>`;
    h += `<div class="sec"><span>${esc(sp.payer)}’s tick list</span></div>${sp.members.filter((m) => m !== sp.payer && m !== 'You').map((m) => `<div class="lrow"><span>${esc(m)}<span class="sub" style="display:block">${sp.paid[m] ? esc(sp.how[m] || 'paid') : 'not yet'}</span></span><span class="v">${rm(sh[m])}</span></div>`).join('')}<span class="note">Only the payer ticks who has paid (D65)</span>`;
  }
  h += `<div class="cardrow"><span>Your share, your spending</span><b>${rm(sh.You || 0)}</b></div>`;
  const all = sp.locked && spDone(sp) === sp.members.length - 1;
  h += `<div class="sub" id="sp-state">${all ? 'Everyone has paid. The link closes tomorrow, so a wrong tick can still be undone.' : 'Link open. It closes a day after the last payment is ticked, or after 30 days.'}</div>`;
  return { t: 'Split', sid: 'split', body: h };
};

// ---------- charts (greyscale: ink is the point, grey is context) ----------
const INK = '#1d1d1d', GREY = '#b4b4b0', GRID = '#e3e3df', MUTE = '#686868';
// cumulative spending by day of cycle, in sen (made up, coherent with the figures)
const THIS_CYCLE = [4500, 101000, 108000, 119000, 126200, 141000, 147000, 156000, 169000, 182000, 211000, 219000, 226000, 238000, 247000, 260000, 268000, 286000, 291550];
const LAST_CYCLE = [6000, 98000, 106000, 113000, 121000, 133000, 141000, 150000, 160500, 171000, 180500, 189000, 198000, 211000, 222000, 236000, 248000, 263000, 277550, 284000, 289000, 293500, 296000, 299000, 301500, 303800, 305600, 307900, 309500, 311000, 312040];
function bar(x, y, w, h) { // 4px rounded data end, square at the baseline (horizontal bar)

function col(x, y, w, h) { // column: rounded top, square base

}
function paceChart(opts) {
  const W = 320, H = opts.h || 150, L = 34, Rr = 64, Tp = 10, Bt = 22; const pw = W - L - Rr, ph = H - Tp - Bt;
  const maxY = 450000, days = 31;

  const path = (arr) => arr.map((v, i) => `${i ? 'L' : 'M'}${X(i + 1).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  const now = THIS_CYCLE.length, last = THIS_CYCLE[now - 1], proj = 389000;
  let g = '';

  g += `<path d="${path(LAST_CYCLE)}" fill="none" stroke="${GREY}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (!opts.mini) g += `<path d="M${X(now)} ${Y(last)}L${X(31)} ${Y(proj)}" fill="none" stroke="${INK}" stroke-width="2" stroke-dasharray="4 4"/>`;
  g += `<path d="${path(THIS_CYCLE)}" fill="none" stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<circle cx="${X(now)}" cy="${Y(last)}" r="4.5" fill="${INK}" stroke="#fff" stroke-width="2"/>`;
  if (!opts.mini) {
    g += `<text x="${X(31) + 6}" y="${Y(proj) + 4}" class="ax">${rm0(proj)} est.</text><text x="${X(31) + 6}" y="${Y(312040) + 16}" class="ax">Last ${rm0(312040)}</text>`;
    g += `<text x="${L}" y="${H - 4}" class="ax">30 Sep</text><text x="${X(now)}" y="${H - 4}" text-anchor="middle" class="ax">Today</text><text x="${W - Rr}" y="${H - 4}" text-anchor="end" class="ax">Payday</text>`;

function legend(items) { return `<div class="legend">${items.map(([k, l]) => `<span><i class="key ${k}"></i>${l}</span>`).join('')}</div>`; }

const CYC = [['Home & bills', 90000, 90000], ['Meals', 64000, 56000], ['Car', 41000, 33000], ['Shopping', 32000, 15000], ['Transport', 21000, 23000], ['Drinks & desserts', 12300, 11000], ['Subscriptions', 9579, 9579], ['Groceries', 9171, 16000], ['Entertainment', 8000, 9000], ['Phone & internet', 4500, 4500]];

// discretionary spending by day: a calendar of the cycle, Wed 30 Sep to Thu 29 Oct
const DISC = [0, 0, 1200, 3400, 2600, 0, 890, 1500, 0, 1800, 28900, 4200, 0, 1200, 2300, 900, 0, 3800, 2400];
function heatmap() {
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']; const start = 2; const cell = 30, gap = 4, L = 30;
  let g = days.map((d, i) => `<text x="${L + i * (cell + gap) + cell / 2}" y="10" text-anchor="middle" class="ax">${d[0]}</text>`).join('');
  for (let k = 0; k < 31; k++) {

    const shade = v == null ? null : (v === 0 ? '#f1f1ee' : v < 1500 ? '#cfcfcb' : v < 3000 ? '#9a9a96' : v < 10000 ? '#5d5d5a' : '#1d1d1d');
    const x = L + c * (cell + gap), y = 16 + r * (cell + gap);
    g += shade ? `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="4" fill="${shade}"/>` : `<rect x="${x + 1}" y="${y + 1}" width="${cell - 2}" height="${cell - 2}" rx="4" fill="none" stroke="${GRID}"/>`;
    if (k === 0 || k === 18) g += `<text x="${x + cell / 2}" y="${y + cell / 2 + 4}" text-anchor="middle" class="ax" fill="${k === 18 ? '#fff' : MUTE}">${k === 0 ? '30' : '18'}</text>`;

  return `<svg viewBox="0 0 ${L + 7 * (cell + gap)} ${16 + 5 * (cell + gap)}" class="chart" style="max-width:280px" role="img" aria-label="Discretionary spending by day">${g}</svg>`;
}
function columns(vals, labels, ref, refLabel, emphLast) {
  const W = 300, H = 120, L = 6, Bt = 18, Tp = 14; const max = Math.max(...vals, ref || 0) * 1.1; const n = vals.length; const slot = (W - L) / n; const w = Math.min(24, slot - 10);
  let g = `<line x1="${L}" x2="${W}" y1="${H - Bt}" y2="${H - Bt}" stroke="${GRID}"/>`;
  vals.forEach((v, i) => { const h = ((H - Bt - Tp) * v) / max; const x = L + i * slot + (slot - w) / 2; g += `<g fill="${emphLast && i === n - 1 ? INK : GREY}">${col(x, H - Bt - h, w, h)}</g><text x="${x + w / 2}" y="${H - 4}" text-anchor="middle" class="ax">${labels[i]}</text>`; });
  if (ref) { const y = H - Bt - ((H - Bt - Tp) * ref) / max; g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="${INK}"/><text x="${W}" y="${y - 4}" text-anchor="end" class="ax">${refLabel}</text>`; }

function spark(vals, w, h) {

const TABS = [['home', 'Home'], ['review', 'Review'], ['scan', 'Scan'], ['insights', 'Insights'], ['more', 'More']];
function tabbar() {
  const rootS = S.stack[0].s; const n = S.att.length;
  return `<nav class="tabbar">${TABS.map(([id, l]) => (id === 'scan'
    ? `<button class="tab plus" data-a="scanTap" id="tab-scan" aria-label="Scan a receipt. Long-press for more"><i></i>${l}</button>`
    : `<button class="tab${rootS === id ? ' on' : ''}" data-a="tab" data-x="${id}" id="tab-${id}"><i></i>${l}${id === 'review' && n ? `<span class="badge">${n}</span>` : ''}</button>`)).join('')}</nav>`;

function renderApp() {
  const r = cur(); const v = SCR[r.s](r);
  if (v.full) return `<div class="app">${v.body}</div>`;
  const canBack = S.stack.length > 1 || v.back;
  const bar = `<header class="appbar">${canBack ? '<button class="ib" data-a="back" aria-label="Back" id="back">‹</button>' : ''}<div class="t">${v.t}</div>${v.right || ''}${S.notes ? `<span class="sid">${esc(v.sid || r.s)}</span>` : ''}</header>`;
  const fab = v.fab && S.stack.length === 1 && S.as !== 'noagent' ? `<button class="fab" data-a="openSen" id="fab" aria-label="Ask Sen">Sen</button>` : '';
  return `<div class="app">${bar}<main class="content${fab ? ' withfab' : ''}" id="content">${v.body}</main>${fab}${v.tabs === false ? '' : tabbar()}</div>`;
}
function renderLayer() {
  let h = '';
  if (S.sen) h += `<div class="scrim" data-a="senClose"></div>${senSheet()}`;
  if (S.sheet && SHEETS[S.sheet.k]) h += `<div class="scrim" data-a="closeSheet"></div><div class="sheet" role="dialog"><div class="grab"></div>${SHEETS[S.sheet.k](S.sheet)}</div>`;
  if (S.toast) { const v = S.view === 'phone' ? { tabs: false } : SCR[cur().s](cur()); h += `<div class="toast${v.tabs === false || S.sen ? ' low' : ''}" id="toast"><span>${esc(S.toast.msg)}</span>${S.toast.undo ? '<button data-a="undo" class="undo" id="undo">Undo</button>' : ''}</div>`; }
  if (S.notif) h += notifHtml(S.notif);

}
let lastKey = '';
function render() {
  document.body.classList.toggle('nonotes', !S.notes);
  const prev = document.getElementById('content'); const keep = prev ? prev.scrollTop : 0;
  const key = S.view + JSON.stringify(cur()) + (S.sen ? 'sen' : '');
  $('#strip').innerHTML = renderStrip();
  $('#phone').innerHTML = (S.view === 'phone' ? renderPhone() : renderApp()) + `<div class="layer">${renderLayer()}</div>`;
  const now = document.getElementById('content'); if (now && key === lastKey) now.scrollTop = keep;
  lastKey = key;
  $('#tool').className = T ? 'on' : ''; $('#tool').innerHTML = T ? renderTool() : '';

}
function applyHL() {
  if (!G.j) return; const st = G.j.steps[G.i]; const sel = st.hl || st.see; if (!sel) return;
  const el = document.querySelector(sel); if (!el) return;
  el.classList.add('hl');
  const box = el.closest('.content, .sheet, .phonehome'); if (!box) return;
  const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  if (r.top < b.top || r.bottom > b.bottom) box.scrollTop += r.top - b.top - 48;
}

function runStep() { const st = G.j.steps[G.i]; if (st.go) st.go(); render(); }
function advance() { G.i += 1; if (G.i >= G.j.steps.length) { G.j = null; render(); } else runStep(); }
function startJourney(id) { const j = J.find((x) => x.id === id); T = null; G.j = j; G.i = 0; fresh(); runStep(); }
function nextStep() {
  const st = G.j.steps[G.i];
  if (st.act) ACT[st.act]({});
  else if (st.hl) { const el = document.querySelector(st.hl); if (el && el.dataset.a && ACT[el.dataset.a]) ACT[el.dataset.a](el.dataset, el); }
  advance();
}
Object.assign(ACT, {
  gNext() { nextStep(); },
  gBack() { const target = G.i - 1; const j = G.j; G.j = j; G.i = 0; fresh(); runStep(); while (G.j && G.i < target) nextStep(); },
  gEnd() { G.j = null; },
  tool(d) { T = d.x; },
  toolClose() { T = null; },
  journey(d) { startJourney(d.x); },
  sim(d) {
    T = null; const x = d.x;
    if (['newm', 'hawker', 'owe', 'capoff', 'payday'].includes(x)) { if (x === 'capoff') S.captureOff = true; if (x === 'payday') S.payday = true; S.notif = mk(x); }
    else if (x === 'known') { addKnown(); S.notif = mk('quiet'); }
    else if (x === 'email') { if (!S.waiting.find((a) => a.id === 'w2')) S.waiting.unshift({ id: 'w2', k: 'rwait', title: 'TELCO ONE e-bill, RM45.00', sub: 'Forwarded just now. Waiting for its payment' }); S.view = 'app'; root('review'); toast('An e-bill arrived by email'); }
    else if (x === 'captureon') S.captureOff = false;
    else if (x === 'offline') S.offline = !S.offline;
    else if (x === 'as') { const was = S.as; fresh(); if (was === 'owner') asFriend(); }
    else if (x === 'notes') S.notes = !S.notes;
    else if (x === 'reset') fresh();
  },
  jump(d) {
    T = null; S.view = 'app'; S.notif = null; const s = d.s;
    const map = {
      scanmore: () => { root('home'); S.sheet = { k: 'scanmore' }; }, cycle: () => { root('home'); S.sheet = { k: 'cycle' }; },
      txn: () => { root('more'); go('payments'); go('txn', { id: 't9' }); }, receipt: () => { root('more'); go('payments'); go('receipt', { id: 'r4' }); },
      scan: () => { root('home'); ACT.startScan({ x: 'attach' }); }, reading: () => { root('home'); S.cf = cfNew('r1', 'attach'); go('reading'); },
      confirm: () => { root('home'); S.cf = cfNew('r4', 'attach'); go('confirm'); }, manual: () => { root('review'); ACT.openManual(); },
      split: () => { root('more'); go('shared'); go('split', { id: 's1' }); }, 'split-public': () => { S.pub = { sp: 's1', who: 'Mei', known: true }; root('home'); go('split-public'); },
      account: () => { root('more'); go('accounts'); go('account', { id: 'ryt' }); }, claim: () => { root('more'); go('claims'); go('claim', { id: 'c1' }); }, goal: () => { root('insights'); go('goals'); go('goal', { id: 'g1' }); },
      payday: () => { S.payday = true; S.pd = 1; root('home'); go('payday'); }, 'sign-in': () => { S.stack = [{ s: 'first-run' }]; S.fr = 1; }, 'first-run': () => { S.stack = [{ s: 'first-run' }]; S.fr = 3; },
      phone: () => { S.view = 'phone'; }, sen: () => { root('home'); S.sen = { ctx: null }; },
    };
    if (map[s]) map[s]();
    else if (s.startsWith('agent/')) { root('home'); go('asub', { id: s.split('/')[1] }); }
    else if (s.startsWith('settings/')) { root('more'); go('settings'); go('set', { id: s.split('/')[1] }); }
    else if (['home', 'review', 'insights', 'more'].includes(s)) root(s);
    else if (['payments', 'shared', 'accounts', 'claims', 'settings'].includes(s)) { root('more'); go(s); }
    else if (['subscriptions', 'goals', 'budgets', 'ins'].includes(s)) { root('insights'); go(s); }
    else { root('home'); go(s); }
  },
  view() { S.view = S.view === 'app' ? 'phone' : 'app'; S.sc = false; },
});

function renderStrip() {
  if (G.j) {
    const st = G.j.steps[G.i]; const last = G.i === G.j.steps.length - 1;
    return `<div class="gtop"><b>${esc(G.j.t)}</b><span>${G.i + 1} of ${G.j.steps.length}</span><button class="gx" data-a="gEnd" aria-label="End the journey">×</button></div><p class="gcap">${esc(st.cap)}</p><div class="gnav"><button data-a="gBack" ${G.i === 0 ? 'disabled' : ''}>‹ Back</button><button class="gpri" data-a="gNext">${last ? 'Finish' : (st.hl ? 'Tap it for me ›' : 'Next ›')}</button></div>`;
  }
  return `<div class="tools"><span class="brand">Sen wireframe</span><button data-a="tool" data-x="journeys" id="t-journeys">Journeys</button><button data-a="tool" data-x="sim" id="t-sim">Simulate</button><button data-a="tool" data-x="screens" id="t-screens">Screens</button><button data-a="view" id="t-view">${S.view === 'app' ? 'Phone' : 'App'}</button></div>`;
}
const SCREEN_INDEX = [
  ['Tabs', ['home', 'review', 'scan', 'insights', 'more', 'sen']],
  ['Home', ['cycle', 'payday']],
  ['Review', ['skipped', 'manual', 'scanmore']],
  ['Receipts', ['reading', 'confirm', 'receipt']],
  ['Shared bills', ['shared', 'split', 'split-public']],
  ['Insights', ['subscriptions', 'goals', 'goal', 'budgets', 'ins']],
  ['More', ['payments', 'txn', 'accounts', 'account', 'balance-check', 'claims', 'claim', 'settings', 'settings/capture', 'settings/email', 'agent/memory', 'agent/usage']],
  ['Outside the tabs', ['sign-in', 'first-run', 'phone']],
];
function renderTool() {
  let h = '';
  if (T === 'journeys') {
    h = `<div class="thead"><h2>Journeys</h2><button class="tclose" data-a="toolClose">Close</button></div><p>Each one walks you through, highlighting what to tap. Tap it yourself, or use the button at the top.</p>`;
    let g = '';
    J.forEach((j) => { if (j.g !== g) { g = j.g; h += `<h3>${esc(g)}</h3>`; } h += `<button class="titem" data-a="journey" data-x="${j.id}" id="j-${j.id}"><b>${esc(j.t)}</b><span class="s">${esc(j.d)}</span></button>`; });
  } else if (T === 'sim') {
    const it = (x, t, s) => `<button class="titem" data-a="sim" data-x="${x}" id="sim-${x}"><b>${t}</b><span class="s">${s}</span></button>`;
    h = `<div class="thead"><h2>Simulate</h2><button class="tclose" data-a="toolClose">Close</button></div><p>The dev simulator panel from the spec: fire what Android would do.</p><h3>Payments</h3>${it('newm', 'Pay at a new merchant', 'RM9.50 at ROTI BAKAR 88: the category prompt')}${it('hawker', 'Pay a hawker by DuitNow', 'A personal name, filed as a merchant')}${it('known', 'Pay at a known merchant', 'RM58.30 at NASI KANDAR ABC: the quiet scan prompt')}${it('owe', 'An hour after a friend’s split', 'The reminder: you owe Mei RM24.40')}${it('email', 'A receipt arrives by email', 'It waits for its payment')}<h3>The cycle and the phone</h3>${it('payday', 'Salary lands', 'The Payday card')}${it(S.captureOff ? 'captureon' : 'capoff', S.captureOff ? 'Capture back on' : 'Capture switches off', 'The watchdog, the widgets, the warning')}${it('offline', S.offline ? 'Back online' : 'Go offline', 'What still works')}<h3>The wireframe</h3>${it('as', S.as === 'owner' ? 'View as a friend without capture' : 'View as the owner', 'D52')}${it('notes', S.notes ? 'Hide the blue notes' : 'Show the blue notes', 'Rules and screen ids')}${it('reset', 'Reset', 'Back to the example data')}`;
  } else {
    h = `<div class="thead"><h2>Screens</h2><button class="tclose" data-a="toolClose">Close</button></div><p>Tap one to open it.</p>`;
    SCREEN_INDEX.forEach(([g, ids]) => { h += `<h3>${esc(g)}</h3><div class="tgrid">${ids.map((s) => `<button class="tid" data-a="jump" data-s="${s}">${s === 'ins' ? 'insights/year' : s}</button>`).join('')}</div>`; });
  }
  return `<div class="tscrim" data-a="toolClose"></div><div class="tsheet" role="dialog">${h}</div>`;
}

render();
