<style>
/* Sen design directions: the shared page and phone styles. Each direction sets the tokens and fonts;
   its own stylesheet adds what only it has. Layout: one centred column; phones side by side when they fit. */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--background); color: var(--foreground); font: 16px/1.5 var(--font-ui); }

:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg { display: block; }
/* the shared icon set (D81): lucide outlines in the look's weight and line ends; colour comes from where the icon sits */
svg.lu { fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: var(--icon-cap); stroke-linejoin: var(--icon-join); }
svg.lu path[d$="h.01"] { stroke-linecap: var(--icon-dot-cap); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- page ---------- */
.pg { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 56px; }
.pg-head { display: grid; gap: 14px; position: relative; }
.pg-nav { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted-foreground); }

.pg-nav .lbl { margin-right: 4px; }

.pg-lede { max-width: 62ch; font-size: 18px; line-height: 1.55; margin: 0; color: var(--foreground); }
.pg-meta { color: var(--muted-foreground); font-size: 14px; margin: 0; max-width: 64ch; }
.pg-sec { display: grid; gap: 18px; min-width: 0; }
.pg-h2 { font: 400 clamp(28px, 5vw, 40px)/1.1 var(--font-display); margin: 0; letter-spacing: -0.005em; }
.pg-p { margin: 0; max-width: 64ch; color: var(--muted-foreground); }
.pg-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cap { font-size: 13px; color: var(--muted-foreground); }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; background: var(--card); flex-wrap: wrap; }
.seg button { padding: 6px 12px; border-radius: 999px; font-size: 14px; color: var(--muted-foreground); }
.seg button[aria-pressed="true"] { background: var(--foreground); color: var(--background); }

/* ---------- phones ---------- */
.phones { display: flex; gap: 14px; justify-content: center; align-items: flex-start; min-width: 0; }
.phone-wrap { flex: none; position: relative; width: calc(390px * var(--z, 1)); height: calc(844px * var(--z, 1)); }
.phone-wrap[hidden] { display: none; }

.phone { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform: scale(var(--z, 1)); transform-origin: 0 0; border-radius: 46px; padding: 9px; background: #0c0c0d; box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 30px 60px -20px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.25); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-ui); display: flex; flex-direction: column; isolation: isolate; }

.sbar { flex: none; height: 34px; padding: 10px 26px 0 30px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: var(--foreground); }

.sbar svg { width: 16px; height: 16px; }
.appbar { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.content { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 2px 20px 96px; display: flex; flex-direction: column; gap: 14px; }
.content::-webkit-scrollbar { display: none; }
.content > * { flex-shrink: 0; }

.hero { display: grid; gap: 3px; width: 100%; padding: 2px 0 0; position: relative; }
.hero-lbl { font-size: 15px; color: var(--muted-foreground); }
.hero-fig { font: var(--hero-weight, 300) var(--hero-size, 54px)/1.05 var(--font-num); letter-spacing: var(--hero-track, -0.015em); color: var(--foreground); display: flex; align-items: baseline; gap: 4px; }
.hero-fig .cur { font-size: 0.4em; letter-spacing: 0.02em; }

.strip { margin-top: 8px; width: 100%; height: 22px; display: block; }

.card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius-card, 16px); padding: 14px 16px; display: grid; gap: 8px; width: 100%; }
.pace .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 15px; }

.quiet { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0 0; border-top: 1px solid var(--border); font-size: 14px; color: var(--muted-foreground); width: 100%; }
.quiet b { color: var(--foreground); font-weight: 500; text-align: right; }

.warnbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: var(--radius-card, 16px); background: var(--warn-bg); color: var(--warn-fg); font-size: 14px; }
.warnbar b { display: block; font-size: 15px; }
.warnbar .fix { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--warn-fg); color: var(--warn-bg); font-weight: 600; font-size: 14px; }

.payday { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; overflow: hidden; }
.payday b { font-size: 16px; display: block; }
.payday .sub { font-size: 14px; color: var(--muted-foreground); }
.btn-pri { flex: none; padding: 9px 16px; border-radius: var(--radius-btn, 999px); background: var(--primary); color: var(--primary-foreground); font-weight: 600; font-size: 14px; }
.btn-ghost { flex: none; padding: 8px 14px; border-radius: var(--radius-btn, 999px); border: 1px solid var(--border); color: var(--foreground); font-weight: 500; font-size: 14px; }

.fab { position: absolute; right: 18px; bottom: 92px; width: 60px; height: 60px; border-radius: 50%; z-index: 4; display: grid; place-items: center; box-shadow: var(--fab-shadow, 0 8px 22px -6px rgba(0,0,0,.45)); }
.fab canvas { border-radius: 50%; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; height: 78px; padding: 8px 6px 20px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--tabbar-bg, var(--background)); border-top: 1px solid var(--border); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted-foreground); position: relative; }
.tab > svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke, 1.75); stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--tab-on, var(--foreground)); font-weight: 600; }
.tab .badge { position: absolute; top: -4px; left: calc(50% + 6px); min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--badge-bg, var(--primary)); color: var(--badge-fg, var(--primary-foreground)); font-size: 11px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tab-scan .scanbtn { width: 50px; height: 38px; border-radius: 14px; display: grid; place-items: center; background: var(--scan-bg, var(--primary)); color: var(--scan-fg, var(--primary-foreground)); }
.tab-scan .scanbtn > svg { width: 22px; height: 22px; }

.tab .ti { position: relative; width: 30px; height: 26px; flex: none; }
.tab .ti > span { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity .22s ease; }
.tab .ti svg { display: block; overflow: visible; }
.tab .i-on, .tab.on .i-off { opacity: 0; }
.tab.on .i-on { opacity: 1; }
.tab .tl { line-height: 1.25; }
.tab-ind { position: absolute; z-index: 2; top: 0; left: calc(6px + (100% - 12px) * (var(--i) + .5) / 5); transform: translateX(-50%); pointer-events: none; transition: left .45s cubic-bezier(.3,.7,.2,1); }
.tab-ind:empty { display: none; }
.tab-scan .scanbtn.cs { background: none; width: 52px; height: 52px; margin-top: -12px; border-radius: 50%; transition: transform .15s ease; }
.tab-scan .scanbtn.cs .sb { width: 100%; height: 100%; display: block; overflow: visible; }
.tab .badge.cb { background: none; padding: 0; min-width: 0; height: auto; border-radius: 0; color: inherit; display: block; top: -6px; left: calc(50% + 4px); }
.tab .badge.cb svg { display: block; overflow: visible; }
.tab .badge.cb b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Sen's sheet ---------- */
.scrim { position: absolute; inset: 0; z-index: 6; background: rgba(0,0,0,.38); opacity: 0; transition: opacity .25s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 44px; z-index: 7; background: var(--popover); color: var(--popover-foreground); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px -10px rgba(0,0,0,.35); }
.sheet.open { transform: none; }
.scrim.open { opacity: 1; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 0; flex: none; }
.sheet-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px 12px 18px; border-bottom: 1px solid var(--border); }
.sheet-head .who { flex: 1; min-width: 0; display: grid; }
.sheet-head .who b { font-size: 17px; font-weight: 600; }
.sheet-head .who span { font-size: 13px; color: var(--muted-foreground); }
.ib { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--icon); }
.ib svg { width: 22px; height: 22px; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 88%; display: grid; gap: 4px; font-size: 15px; line-height: 1.45; }
.msg.sen { align-self: flex-start; }
.msg.sen p { margin: 0; font: var(--voice-style, normal) var(--voice-weight, 400) var(--voice-size, 15px)/1.45 var(--font-voice); }
.msg.me { align-self: flex-end; background: var(--secondary); color: var(--secondary-foreground); padding: 9px 13px; border-radius: 18px 18px 4px 18px; }
.msg .when { font-size: 12px; color: var(--muted-foreground); }
.msg .acts { display: flex; gap: 8px; margin-top: 6px; }
.chips { display: flex; gap: 8px; padding: 0 18px 10px; overflow-x: auto; flex: none; }
.chip { flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); font-size: 14px; color: var(--foreground); background: var(--card); }
.composer { flex: none; margin: 0 14px 22px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border: 1px solid var(--input); border-radius: 999px; color: var(--muted-foreground); font-size: 15px; }
.composer > span:first-child { flex: 1; }
.composer .send { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; }
.composer .send svg { width: 18px; height: 18px; }
.ctxchip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }

/* ---------- Sen section ---------- */
.sen-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: center; }
@media (min-width: 760px) { .sen-top { grid-template-columns: 300px minmax(0, 1fr); } }
.sen-stage { display: grid; place-items: center; padding: 18px 0; }
.profile { display: grid; gap: 14px; min-width: 0; }
.profile h3 { margin: 0; font: 400 34px/1.1 var(--font-display); }
.profile .role { color: var(--muted-foreground); margin: 0; }
.profile dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 560px) { .profile dl { grid-template-columns: 120px minmax(0, 1fr); gap: 10px 18px; } }
.profile dt { font-size: 14px; color: var(--muted-foreground); }

.states { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .states { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.state { display: grid; gap: 8px; justify-items: start; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-card, 16px); background: var(--card); }

.state span { font-size: 13px; color: var(--muted-foreground); line-height: 1.35; }
.incontext { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.ctxbox { border: 1px solid var(--border); border-radius: var(--radius-card, 16px); padding: 14px; display: grid; gap: 10px; align-content: start; background: var(--card); min-width: 0; }
.ctxbox .cap { margin: 0; }

/* ---------- icon section ---------- */
.icon-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 860px) { .icon-top { grid-template-columns: 360px minmax(0, 1fr); align-items: start; } }
.launcher { position: relative; width: 100%; max-width: 360px; aspect-ratio: 360 / 600; border-radius: 30px; overflow: hidden; padding: 12px 16px 16px; display: flex; flex-direction: column; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.launcher .lsb { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; opacity: .95; padding: 0 6px; }
.launcher .clock { margin: 26px 6px 0; font-size: 50px; font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
.launcher .date { margin: 6px 6px 0; font-size: 14px; opacity: .9; }
.lgrid { margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 6px; justify-items: center; }
.app { display: grid; justify-items: center; gap: 6px; width: 100%; position: relative; }
.app-ic { width: 56px; height: 56px; display: block; }
.app-ic.plain { border-radius: 18px; display: grid; place-items: center; }
.app-ic.plain svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.app-lbl { font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.dock { margin-top: 18px; padding: 10px 6px; border-radius: 26px; background: rgba(255,255,255,.16); display: grid; grid-template-columns: repeat(4, 1fr); justify-items: center; }
.pop { position: absolute; z-index: 2; width: 196px; border-radius: 18px; background: rgba(250,250,252,.97); color: #1b1b1f; box-shadow: 0 16px 40px -10px rgba(0,0,0,.5); padding: 6px; font-size: 14px; }
.pop div { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; }
.pop svg { width: 20px; height: 20px; }
.icon-side { display: grid; gap: 18px; min-width: 0; }
.masks { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
.maskc { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
.anatomy { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.layer { display: grid; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
.layer .box { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: repeating-conic-gradient(var(--checker) 0 25%, transparent 0 50%) 0 0 / 12px 12px; border: 1px solid var(--border); }
.layer .box svg { width: 100%; height: 100%; }

.themed { border-radius: 24px; padding: 16px; display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
.themed .app { width: auto; }
.themed .app-lbl { text-shadow: none; }
.shade { border-radius: 24px; background: #17181c; color: #eceef2; padding: 12px; display: grid; gap: 10px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.shade .ssb { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; padding: 0 8px; }
.shade .ssb .icons { display: flex; gap: 6px; align-items: center; }
.shade .ssb svg { width: 15px; height: 15px; }
.notif { background: #26272d; border-radius: 20px; padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; }
.notif .nh { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #b9bcc6; }
.notif .nh svg { width: 16px; height: 16px; }
.notif .nb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.notif .nt { font-weight: 600; }
.notif .nx { color: #c9ccd4; line-height: 1.4; }
.notif .na { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.notif .na span { padding: 6px 12px; border-radius: 999px; background: #34363e; font-size: 13px; font-weight: 600; color: #e7e9ee; }

/* ---------- tab bar section: the bar at full size in each mode, then every icon at twice its size ---------- */
.tabdemos { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

.tabdemo-wrap { display: grid; gap: 6px; justify-items: center; min-width: 0; }
.phone.tabdemo { position: relative; left: auto; top: auto; transform: none; width: 100%; max-width: 390px; height: 104px; padding: 0; border-radius: 22px; background: none; box-shadow: 0 0 0 1px var(--border); overflow: hidden; }
.phone.tabdemo .screen { border-radius: 22px; }
.iconsheets { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 820px) { .iconsheets { grid-template-columns: 1fr 1fr; } }
.iconsheet { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 8px; padding: 18px 10px 14px; border-radius: var(--radius-card, 16px); border: 1px solid var(--border); background: var(--tabbar-bg, var(--background)); color: var(--foreground); }
.iconsheet .ic { display: grid; justify-items: center; align-content: start; gap: 18px; }

.iconsheet .ic2 > svg { transform: scale(2); overflow: visible; }
.iconsheet .ic-scan { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 22px; padding-top: 14px; margin-top: 4px; border-top: 1px solid var(--border); }
.iconsheet .ic-scan .ic2 { width: 84px; height: 84px; }

/* ---------- theme section ---------- */
.tok { width: 100%; border-collapse: collapse; font-size: 14px; }
.tokwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-card, 16px); background: var(--card); }
.tok th, .tok td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tok th { font-weight: 600; font-size: 13px; color: var(--muted-foreground); }
.tok tr:last-child td { border-bottom: 0; }
.tok .sw { display: inline-block; width: 22px; height: 22px; border-radius: 6px; vertical-align: middle; margin-right: 8px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); }
.tok code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.tok .ratio { font-size: 12px; color: var(--muted-foreground); margin-left: 6px; }
.tok .ok { color: var(--money-in); }
.moneyrow { display: flex; flex-wrap: wrap; gap: 10px; }
.mchip { display: grid; gap: 2px; padding: 10px 14px; border-radius: var(--radius-card, 14px); border: 1px solid var(--border); min-width: 150px; }
.mchip span { font-size: 12px; color: var(--muted-foreground); }
.mchip b { font: 600 18px/1.2 var(--font-ui); }
.mchip.in b { color: var(--money-in); }
.mchip.out b { color: var(--money-out); }

function paceChart(st, mode) {
  const W = 318, H = 76, L = 2, R = 2, T = 14, B = 16; const pw = W - L - R, ph = H - T - B; const days = 31, maxY = 470000;

  const line = (arr) => arr.map((v, i) => `${i ? 'L' : 'M'}${f2(X(i + 1))} ${f2(Y(v))}`).join('');

  const main = (r, dx = 0, dy = 0) => [[c + dx + wob(0, s * 0.012), c + dy + wob(1, s * 0.01), r], [c + dx + s * 0.05 + wob(2, s * 0.02), c + dy - s * 0.03, r * 0.55], [c + dx - s * 0.05, c + dy + s * 0.04 + wob(3, s * 0.02), r * 0.5]];
  if (st === 'resting') return main(R);
  if (st === 'note') { const k = (Math.sin(t * 2.2) + 1) / 2; return main(R).concat([[c + s * (0.3 - 0.03 * k), c - s * (0.22 - 0.02 * k), s * 0.065]]); }
  if (st === 'listening') return main(R * 1.12).map((d) => [d[0], d[1] - s * 0.01, d[2]]);
  if (st === 'thinking') { const a = t * 2.4; return [[c + Math.cos(a) * s * 0.09, c + Math.sin(a) * s * 0.09, R * 0.82], [c - Math.cos(a) * s * 0.09, c - Math.sin(a) * s * 0.09, R * 0.82], [c, c, R * 0.4]]; }
  if (st === 'helpers') { const out = main(R * 0.9); for (let h = 0; h < 3; h++) { const a = t * 0.9 + h * TAU / 3; const r = s * (0.26 + 0.05 * Math.sin(t * 1.7 + h)); out.push([c + Math.cos(a) * r, c + Math.sin(a) * r, s * 0.07]); } return out; }
  if (st === 'speaking') { const v = Math.abs(Math.sin(t * 7.5) * Math.sin(t * 2.3)); return main(R * (0.94 + 0.12 * v)).concat([[c + s * 0.14 * Math.cos(t * 3), c + s * 0.14 * Math.sin(t * 3), R * 0.35 * v]]); }
  if (st === 'paused') return [[c, c, R], [c + s * 0.04, c - s * 0.02, R * 0.5]];
  if (st === 'done') { const k = (t % 3) / 3; const g = Math.min(1, k / 0.35); const d = s * 0.2 * (1 - g); const sq = 1 + 0.12 * Math.sin(Math.min(1, Math.max(0, (k - 0.35) / 0.3)) * Math.PI); return [[c - d, c, R * 0.72 * sq], [c + d, c, R * 0.72 * sq], [c, c, R * 0.3 * g]]; }
  return main(R);
}

// ---------- the tab bar: channels etched in the stone; the active one runs full of quicksilver ----------
const MQ_TAB = {
  light: { etch: 'rgba(43,37,32,.66)', lip: 'rgba(255,255,255,.8)', shade: 'rgba(30,20,12,.3)' },
  dark: { etch: 'rgba(239,232,223,.56)', lip: 'rgba(0,0,0,.5)', shade: 'rgba(0,0,0,.55)' },

// a tube of liquid metal, shaded in layers so it reads as round whichever way the stroke runs: a warm floor, a dark body, the sky above
const MQ_LAYERS = [[3.15, '#b08a64', 0.45, 0, 0.32], [2.75, '#211b16', 1, 0, 0], [2, '#7d756e', 1, -0.05, -0.1], [1.2, '#d6d0c8', 1, -0.2, -0.32], [0.48, '#fffaf2', 0.95, -0.32, -0.52]];
const mqBead = (id) => `<radialGradient id="${id}" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fbf9f6"/><stop offset=".3" stop-color="#bdb7b0"/><stop offset=".64" stop-color="#2d261f"/><stop offset=".86" stop-color="#7a634d"/><stop offset="1" stop-color="#d8b994"/></radialGradient>`;
function mqEtch(k, c, w) {
  const S = TAB_SK[k]; const lip = (d) => `<path d="${d}" fill="none" stroke="${c.lip}" stroke-width="${w + 0.2}" stroke-linecap="round" stroke-linejoin="round" transform="translate(.3 .45)"/>`;
  const groove = (d) => `<path d="${d}" fill="none" stroke="${c.etch}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (S.dots) return S.dots.map(([x, y]) => `<circle cx="${x + 0.3}" cy="${y + 0.45}" r="1.75" fill="none" stroke="${c.lip}" stroke-width="${w}"/><circle cx="${x}" cy="${y}" r="1.75" fill="none" stroke="${c.etch}" stroke-width="${w}"/>`).join('');
  const d = S.d.join(''); return lip(d) + groove(d);
}
function mqTabIcon(k, on, mode, u) {
  const c = MQ_TAB[mode], S = TAB_SK[k];

  if (S.dots) return svgTag('0 0 24 24', 24, 24, `<defs>${mqBead(`${u}b`)}</defs>${mqEtch(k, c, 1.1)}${S.dots.map(([x, y], i) => `<circle cx="${x + 0.25}" cy="${y + 0.7}" r="2.25" fill="${c.shade}"/><circle class="bead" style="--n:${i}" cx="${x}" cy="${y}" r="2.35" fill="url(#${u}b)"/>`).join('')}`);
  const tube = S.d.map((d, i) => `<g class="hg" style="--n:${i}"><path d="${d}" fill="none" stroke="${c.shade}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(.35 .8)" pathLength="1"/>${MQ_LAYERS.map(([w, col, a, dx, dy]) => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${a}" stroke-linecap="round" stroke-linejoin="round"${dx || dy ? ` transform="translate(${dx} ${dy})"` : ''} pathLength="1"/>`).join('')}</g>`).join('');
  return svgTag('0 0 24 24', 24, 24, mqEtch(k, c, 1.1) + tube);
}
