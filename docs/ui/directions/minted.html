<style>
/* Sen design directions: the shared page and phone styles. Each direction sets the tokens and fonts;
   its own stylesheet adds what only it has. Layout: one centred column; phones side by side when they fit. */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--background); color: var(--foreground); font: 16px/1.5 var(--font-ui); }

.num { font-variant-numeric: tabular-nums; }

/* ---------- page ---------- */
.pg { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 56px; }

.pg-sec { display: grid; gap: 18px; min-width: 0; }

.pg-p { margin: 0; max-width: 64ch; color: var(--muted-foreground); }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; background: var(--card); flex-wrap: wrap; }

.card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius-card, 16px); padding: 14px 16px; display: grid; gap: 8px; width: 100%; }

.btn-pri { flex: none; padding: 9px 16px; border-radius: var(--radius-btn, 999px); background: var(--primary); color: var(--primary-foreground); font-weight: 600; font-size: 14px; }

.fab { position: absolute; right: 18px; bottom: 92px; width: 60px; height: 60px; border-radius: 50%; z-index: 4; display: grid; place-items: center; box-shadow: var(--fab-shadow, 0 8px 22px -6px rgba(0,0,0,.45)); }
.fab canvas { border-radius: 50%; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; height: 78px; padding: 8px 6px 20px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--tabbar-bg, var(--background)); border-top: 1px solid var(--border); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted-foreground); position: relative; }
.tab > svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke, 1.75); stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--tab-on, var(--foreground)); font-weight: 600; }
.tab .badge { position: absolute; top: -4px; left: calc(50% + 6px); min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--badge-bg, var(--primary)); color: var(--badge-fg, var(--primary-foreground)); font-size: 11px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tab-scan .scanbtn { width: 50px; height: 38px; border-radius: 14px; display: grid; place-items: center; background: var(--scan-bg, var(--primary)); color: var(--scan-fg, var(--primary-foreground)); }

.tab.on .i-on { opacity: 1; }
.tab .tl { line-height: 1.25; }
.tab-ind { position: absolute; z-index: 2; top: 0; left: calc(6px + (100% - 12px) * (var(--i) + .5) / 5); transform: translateX(-50%); pointer-events: none; transition: left .45s cubic-bezier(.3,.7,.2,1); }

.tab-scan .scanbtn.cs { background: none; width: 52px; height: 52px; margin-top: -12px; border-radius: 50%; transition: transform .15s ease; }
.tab-scan .scanbtn.cs .sb { width: 100%; height: 100%; display: block; overflow: visible; }
.tab .badge.cb { background: none; padding: 0; min-width: 0; height: auto; border-radius: 0; color: inherit; display: block; top: -6px; left: calc(50% + 4px); }
.tab .badge.cb svg { display: block; overflow: visible; }
.tab .badge.cb b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Sen's sheet ---------- */
.scrim { position: absolute; inset: 0; z-index: 6; background: rgba(0,0,0,.38); opacity: 0; transition: opacity .25s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 44px; z-index: 7; background: var(--popover); color: var(--popover-foreground); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px -10px rgba(0,0,0,.35); }

.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 0; flex: none; }
.sheet-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px 12px 18px; border-bottom: 1px solid var(--border); }

.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 88%; display: grid; gap: 4px; font-size: 15px; line-height: 1.45; }
.msg.sen { align-self: flex-start; }
.msg.sen p { margin: 0; font: var(--voice-style, normal) var(--voice-weight, 400) var(--voice-size, 15px)/1.45 var(--font-voice); }
.msg.me { align-self: flex-end; background: var(--secondary); color: var(--secondary-foreground); padding: 9px 13px; border-radius: 18px 18px 4px 18px; }

.ctxchip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }

/* ---------- Sen section ---------- */
.sen-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: center; }

function paceChart(st, mode) {

/* Direction: Minted. Money's own craft: guilloché engraving, intaglio ink on opaline paper.
   Sen is a living rosette: two engraved bands around a silver bead (the sen). */

// The rosette: an outer rope (six wavy rings, twisted like a coin's milled edge) around an inner lace
// (six rose curves), with a silver bead at the centre, the sen. Radii are fractions of the mark's size.
const MINT = [
  { R: 0.37, A: 0.035, p: 20, copies: 6, spread: 0.34 },
  { R: 0.2, A: 0.1, p: 8, copies: 6, spread: 1 },
];
function bandPaths(cx, cy, size, b, steps, rot = 0) {
  const out = [];
  for (let k = 0; k < b.copies; k++) {
    const ph = (k / b.copies) * (TAU / b.p) * b.spread + rot; const pts = [];
    for (let j = 0; j < steps; j++) { const th = (j / steps) * TAU; const r = size * (b.R + b.A * Math.cos(b.p * th)); pts.push([cx + r * Math.cos(th + ph), cy + r * Math.sin(th + ph)]); }
    out.push(polyD(pts, true));
  }
  return out;
}
// size: the mark's diameter in the SVG's units
function rosetteSVG(cx, cy, size, color, sw, opacity) {
  const d = MINT.flatMap((b, i) => bandPaths(cx, cy, size, b, i ? 150 : 220));
  return `<g fill="none" stroke="${color}" stroke-width="${sw}" opacity="${opacity}" stroke-linejoin="round">${d.map((x) => `<path d="${x}"/>`).join('')}</g>`;
}

// microprint, the security line under the total and along the tab bar: one phrase, too small to copy
const mtMicro = (w, cls) => `<svg class="${cls}" viewBox="0 0 ${w} 5" preserveAspectRatio="none" aria-hidden="true"><text x="0" y="3.9" font-size="3.6" textLength="${w}" lengthAdjust="spacing" fill="currentColor">${'EVERY SEN COUNTED • '.repeat(Math.round(w / 58))}</text></svg>`;
// the foil seal on the payday card: an iridescent disc with the rosette struck through it
const mtSeal = () => `<svg class="seal" viewBox="0 0 108 108" aria-hidden="true"><defs><linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfd9ea"/><stop offset=".35" stop-color="#e9dcf3"/><stop offset=".6" stop-color="#f3e7c9"/><stop offset=".85" stop-color="#cde8e2"/><stop offset="1" stop-color="#cfd9ea"/></linearGradient></defs><circle cx="54" cy="54" r="50" fill="url(#foil)"/>${rosetteSVG(54, 54, 100, '#4b5d78', 0.7, 0.6)}<circle cx="54" cy="54" r="7" fill="#4b5d78" opacity=".7"/></svg>`;

// ---------- the tab bar: engraved icons, and a bead riding the microprint ----------
const MT_TAB = {
  light: { idle: '#4b5b6c', on: '#0f2238', bead: ['#7f9cc0', '#173a63', '#0a192c'], btn: ['#26507f', '#14304f', '#0a192c'], badge: ['#173a63', '#f5f8fa'] },
  dark: { idle: '#95a5b7', on: '#e3e9ef', bead: ['#ffffff', '#c3d3e6', '#7f93ad'], btn: ['#2c5a8c', '#14304f', '#0a192c'], badge: ['#c3d3e6', '#0b1522'] },
};
// a line cut twice, the way engravers outline a letter: the stroke with its middle left uncut
function mtInline(d, color, w, u) {
  return `<defs><mask id="${u}m" maskUnits="userSpaceOnUse" x="-4" y="-4" width="32" height="32"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${d}" stroke="#fff" stroke-width="${w}"/><path d="${d}" stroke="#000" stroke-width="${f2(w * 0.33)}"/></g></mask></defs><rect x="-4" y="-4" width="32" height="32" fill="${color}" mask="url(#${u}m)"/>`;
}
const mtBead = (c, u) => `<radialGradient id="${u}" cx="36%" cy="32%" r="72%"><stop offset="0" stop-color="${c.bead[0]}"/><stop offset=".6" stop-color="${c.bead[1]}"/><stop offset="1" stop-color="${c.bead[2]}"/></radialGradient>`;
function mtIcon(k, on, mode, u) {
  const c = MT_TAB[mode], S = TAB_SK[k];

    return svgTag('0 0 24 24', 24, 24, on ? `<defs>${mtBead(c, `${u}b`)}</defs>${S.dots.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.3" fill="url(#${u}b)"/>`).join('')}`
      : S.dots.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.95" fill="none" stroke="${c.idle}" stroke-width=".8"/><circle cx="${x}" cy="${y}" r=".6" fill="${c.idle}"/>`).join(''));

  const face = S.area ? `<defs><pattern id="${u}h" width="1.45" height="1.45" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width=".5" height="1.45" fill="${c.on}"/></pattern><clipPath id="${u}c"><path d="${S.area}"/></clipPath><mask id="${u}r" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect class="cut" width="24" height="24" fill="#fff"/></mask></defs><g mask="url(#${u}r)"><rect width="24" height="24" fill="url(#${u}h)" clip-path="url(#${u}c)" opacity=".9"/></g>` : '';
  return svgTag('0 0 24 24', 24, 24, `${face}<path d="${d}" fill="none" stroke="${c.on}" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>`);

// the scan button: a coin in intaglio blue, with a milled edge and the scan mark cut in silver
function mtScan(mode, u) {

  return svgTag('0 0 52 52', 52, 52, `<defs><radialGradient id="${u}g" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="${c.btn[0]}"/><stop offset=".58" stop-color="${c.btn[1]}"/><stop offset="1" stop-color="${c.btn[2]}"/></radialGradient></defs><circle cx="26" cy="26" r="24" fill="url(#${u}g)"/>${ring(22.4, 1.3, '.75 .9', 0.5)}${ring(20.3, 0.5, '', 0.35)}<g transform="translate(14 14)">${mtInline(TAB_SK.scan.d.join(''), '#dae5f1', 2.25, `${u}l`)}</g>`, 'sb');
}
// the review count on a seal with a scalloped edge
function mtBadge(n, mode) {
  const [fill, ink] = MT_TAB[mode].badge; const pts = []; for (let i = 0; i < 112; i++) { const t = (i / 112) * TAU; const r = 9.7 + 0.72 * Math.cos(16 * t); pts.push([10.6 + r * Math.cos(t), 10.6 + r * Math.sin(t)]); }
  return `${svgTag('0 0 21.2 21.2', 21.2, 21.2, `<path d="${polyD(pts, true)}" fill="${fill}"/><circle cx="10.6" cy="10.6" r="7.5" fill="none" stroke="${ink}" stroke-width=".5" opacity=".5"/>`)}<b style="color:${ink}">${n}</b>`;
