// Cloud sessions only, copied into ~/.gradle/init.d by scripts/session-setup.sh (docs/cloud.md §5): Maven Central answers 429 to this VM; Google's mirror of it doesn't.
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
def swap = { RepositoryHandler repos ->
  repos.withType(MavenArtifactRepository).configureEach { r ->
    if (r.url.toString().startsWith('https://repo.maven.apache.org')) r.url = mirror
  }
}
beforeSettings { s ->
  swap(s.pluginManagement.repositories)
  // the plugin portal redirects a plugin's dependencies to Maven Central, so the mirror goes first
  def plugins = s.pluginManagement.repositories
  def first = plugins.maven { name = 'centralMirror'; url = mirror }
  plugins.remove(first)
  plugins.add(0, first)
  s.dependencyResolutionManagement.repositories.withType(MavenArtifactRepository).configureEach { r ->
    if (r.url.toString().startsWith('https://repo.maven.apache.org')) r.url = mirror
  }
}
allprojects { p ->
  swap(p.repositories)
  p.buildscript { swap(repositories) }
}
