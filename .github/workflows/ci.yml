# Every PR and every push to main: hygiene, typecheck, lint, format, unit tests and Playwright. Behaviour
# (the journeys) runs once, in Minted, light; the catalogue of every screen (its tree, pixels and
# checks) runs in the looks E2E_LOOKS names: two on a PR (Minted and Copper, light and dark), all six
# nightly and by hand (owner, 12 Oct; D137). A screen's tree is committed, and a changed one fails here.
# No pull_request_target and no secret but DENYLIST, which a fork's PR never sees (spec §17).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 19 * * *' # 3:17 am in Kuala Lumpur
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # every commit of the PR, or of the push, is checked, not only the last
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # the check needs Node alone; without this, setup-node sees package.json's packageManager
          # and looks for pnpm, which this job doesn't install
          package-manager-cache: false
      - name: No private/ files, no denylisted strings, in any commit
        run: node scripts/hygiene.mjs
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          HYGIENE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HYGIENE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The look tokens match docs/ui/directions
        run: pnpm --filter @sen/web looks --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  # The database (B05): every migration on a fresh Postgres, the pgTAP tests (RLS for two people, the
  # catalogue check), then the API's tests against it. A local Postgres in the runner, never Neon.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres 16 with pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl stop postgresql || true
          sudo scripts/local-db.sh start
      - run: pnpm test:db
      - run: pnpm --filter @sen/web exec playwright install --with-deps chromium
      - run: pnpm --filter @sen/web e2e:server

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub's runners have no browser for this Playwright version. Cloud sessions use the preinstalled
      # Chromium and never run this (docs/cloud.md §1).
      - run: pnpm --filter @sen/web exec playwright install --with-deps chromium
      # two looks on PRs and pushes; all six on the nightly run and by hand
      - run: pnpm e2e
        env:
          E2E_LOOKS: "${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'all' || 'minted,copper' }}"
      # time and real conditions the journeys above never span: a deploy under an open app, the background,
      # a dropped or slow connection, large text, a small phone, a year of data (D139). Its report goes
      # into the same folder, as playwright-report/lived.
      - run: pnpm --filter @sen/web e2e:lived
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
