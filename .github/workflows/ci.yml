# Every PR and every push to main: hygiene, typecheck, lint, format, unit tests and Playwright.
# No pull_request_target and no secret but DENYLIST, which a fork's PR never sees (spec §17).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: No private/ files, no denylisted strings
        run: node scripts/hygiene.mjs
        env:
          DENYLIST: ${{ secrets.DENYLIST }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The look tokens match docs/ui/directions
        run: pnpm --filter @sen/web looks --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub's runners have no browser for this Playwright version. Cloud sessions use the preinstalled
      # Chromium and never run this (docs/cloud.md §1).
      - run: pnpm --filter @sen/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
